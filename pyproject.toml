[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "serviceplan"
version = "1.0.0"
requires-python = ">=3.12"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
ignore = ["E401", "E701", "E702"]
